# tools/build.conf: per-game settings for build_elf.sh. Sourced by bash.

# The splat config this project builds from.
YAML=split/aidyn.us.yaml

# Cross binutils prefix (mips-linux-gnu-as, -ld, -objcopy).
CROSS=mips-linux-gnu-

# Assembler flags. Fill in from the game's decomp if it has one; these are the
# usual flags for splat's GCC/KMC-style output on the VR4300.
ASFLAGS=(-EB -march=vr4300 -mtune=vr4300 -mabi=32 -mfp32 -G 0 --no-pad-sections
         -I split/include -I split -I .)

# Extra linker flags, and hand-written linker inputs (each passed with -T if it exists).
LDFLAGS=(--no-check-sections)
LD_EXTRA_SCRIPTS=(split/undefined_syms.txt split/undefined_funcs.txt)

# Byte used to pad the built ROM up to the base ROM's size.
PAD_BYTE=0x00

# RSPRecomp configs tools/recomp.sh runs, one per microcode the game needs recompiled.
RSP_CONFIGS=(aspMain.us.toml)
