# The macOS (Apple Silicon) build, on GitHub's own Mac runners: see tools/macos/README.md.
#
# The ROM comes from a private repository (secrets ROM_REPO, ROM_REPO_TOKEN) and stays on the runner: the recompiled game code
# is made, compiled and used inside this one job, and nothing derived from the ROM is uploaded, cached or published. Only the
# MIPS binutils and the recompilers (tools, not game code) are cached. Without the secrets (a fork) the job is skipped.
#
# Manual runs for now; once it passes, pushes that touch the build will start it too.
name: macos

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version of this build (the .dmg is named after it), e.g. 1.0.4-beta.1'
        default: '1.0.3-beta.0'

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

env:
  GIT_TERMINAL_PROMPT: '0'
  HOMEBREW_NO_AUTO_UPDATE: '1'
  HOMEBREW_NO_INSTALL_CLEANUP: '1'
  BINUTILS_VERSION: '2.45.1'
  BINUTILS_SHA256: '5fe101e6fe9d18fdec95962d81ed670fdee5f37e3f48f0bef87bddf862513aa5'
  VERSION: ${{ inputs.version || '1.0.3-beta.0' }}
  SDL2_VERSION: '2.32.10'
  SDL2_SHA256: '5f5993c530f084535c65a6879e9b26ad441169b3e25d789d83287040a9ca5165'   # also GitHub's own digest of the release asset

jobs:
  macos:
    runs-on: macos-15            # pinned: it sets the lowest macOS the game runs on (15)
    timeout-minutes: 150
    steps:
      - name: Check the secrets
        id: have
        env:
          ROM_REPO: ${{ secrets.ROM_REPO }}
          ROM_REPO_TOKEN: ${{ secrets.ROM_REPO_TOKEN }}
        run: |
          if [ -n "$ROM_REPO" ] && [ -n "$ROM_REPO_TOKEN" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "ROM_REPO / ROM_REPO_TOKEN not set: nothing to build"; echo "ok=false" >> "$GITHUB_OUTPUT"; fi

      - name: Checkout (public submodules only)
        if: steps.have.outputs.ok == 'true'
        run: |
          git clone -q --no-checkout "https://github.com/$GITHUB_REPOSITORY" .
          git checkout -q "$GITHUB_SHA"
          git submodule update -q --init --recursive decomp lib/N64ModernRuntime lib/rt64

      - name: Install tools
        if: steps.have.outputs.ok == 'true'
        run: |
          brew install cmake ninja pkg-config xxhash dylibbundler bash coreutils gnu-sed grep findutils
          # The project's scripts are bash 4 + GNU coreutils (mapfile, sha1sum, stat -c, readlink -f).
          P=$(brew --prefix)
          for d in "$P/bin" "$P/opt/coreutils/libexec/gnubin" "$P/opt/gnu-sed/libexec/gnubin" "$P/opt/grep/libexec/gnubin" "$P/opt/findutils/libexec/gnubin"; do
            echo "$d" >> "$GITHUB_PATH"
          done
          # RT64 turns its shaders into Metal libraries with Xcode's Metal compiler (Xcode 26 and later fetch it separately).
          xcrun -sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain
          xcrun -sdk macosx metal --version

      # Official SDL2, built here: Homebrew's "sdl2" is sdl2-compat, which needs SDL3 loaded at run time.
      - name: SDL2 (cached)
        if: steps.have.outputs.ok == 'true'
        id: sdl_cache
        uses: actions/cache@v4
        with:
          path: ~/sdl2
          key: sdl2-${{ runner.os }}-${{ runner.arch }}-2.32.10-v1
      - name: Build SDL2
        if: steps.have.outputs.ok == 'true' && steps.sdl_cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/sdl2.tar.gz" "https://github.com/libsdl-org/SDL/releases/download/release-$SDL2_VERSION/SDL2-$SDL2_VERSION.tar.gz"
          echo "$SDL2_SHA256  $RUNNER_TEMP/sdl2.tar.gz" | shasum -a 256 -c -
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/sdl2.tar.gz"
          cmake -S "$RUNNER_TEMP/SDL2-$SDL2_VERSION" -B "$RUNNER_TEMP/sdl2-build" -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX="$HOME/sdl2" -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
              -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TEST=OFF
          cmake --build "$RUNNER_TEMP/sdl2-build"
          cmake --install "$RUNNER_TEMP/sdl2-build"

      - name: MIPS binutils (cached)
        if: steps.have.outputs.ok == 'true'
        id: mips_cache
        uses: actions/cache@v4
        with:
          path: ~/mips
          key: mips-binutils-${{ runner.os }}-${{ runner.arch }}-2.45.1-v1

      - name: Build MIPS binutils
        if: steps.have.outputs.ok == 'true' && steps.mips_cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/binutils.tar.xz" "https://ftpmirror.gnu.org/gnu/binutils/binutils-$BINUTILS_VERSION.tar.xz"
          echo "$BINUTILS_SHA256  $RUNNER_TEMP/binutils.tar.xz" | shasum -a 256 -c -
          tar -C "$RUNNER_TEMP" -xf "$RUNNER_TEMP/binutils.tar.xz"
          mkdir "$RUNNER_TEMP/binutils-build" && cd "$RUNNER_TEMP/binutils-build"
          "$RUNNER_TEMP/binutils-$BINUTILS_VERSION/configure" --target=mips-linux-gnu --prefix="$HOME/mips" \
              --disable-nls --disable-gdb --disable-gprof --disable-gprofng --disable-sim --disable-werror --disable-gold \
              --with-system-zlib  # the bundled zlib doesn't compile with Apple's clang
          make -j3
          make install

      - name: N64 recomp toolkit (cached)
        if: steps.have.outputs.ok == 'true'
        id: toolkit_sha
        run: |
          echo "sha=$(git ls-remote https://github.com/spitzdano/n64-recomp-toolkit HEAD | cut -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: steps.have.outputs.ok == 'true'
        id: toolkit_cache
        with:
          path: ~/toolkit
          key: toolkit-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolkit_sha.outputs.sha }}
      - name: Build the toolkit (N64Recomp, RSPRecomp, splat)
        if: steps.have.outputs.ok == 'true' && steps.toolkit_cache.outputs.cache-hit != 'true'
        run: |
          git clone -q --depth 1 https://github.com/spitzdano/n64-recomp-toolkit ~/toolkit
          cd ~/toolkit && ./build.sh

      - name: Get the ROM
        if: steps.have.outputs.ok == 'true'
        env:
          ROM_REPO: ${{ secrets.ROM_REPO }}
          ROM_REPO_TOKEN: ${{ secrets.ROM_REPO_TOKEN }}
        run: |
          git clone -q --depth 1 "https://x-access-token:$ROM_REPO_TOKEN@github.com/$ROM_REPO.git" "$RUNNER_TEMP/rom"
          cp "$RUNNER_TEMP/rom/baserom.us.z64" baserom.z64
          rm -rf "$RUNNER_TEMP/rom"
          tools/check_rom.sh && echo "ROM matches rom.sha1"

      - name: Recompile the game (split, link, N64Recomp, RSPRecomp)
        if: steps.have.outputs.ok == 'true'
        run: |
          export N64RECOMP_TOOLKIT="$HOME/toolkit"
          export PATH="$HOME/mips/bin:$PATH"
          tools/split.sh
          tools/build_elf.sh
          tools/recomp.sh

      - name: Build
        if: steps.have.outputs.ok == 'true'
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$HOME/sdl2;$(brew --prefix)" \
              -DAIDYN_VERSION="$VERSION"
          cmake --build build --target AidynReChronicled -j3 -- -k 0  # -k 0: every error at once, not the first

      - name: Smoke test
        if: steps.have.outputs.ok == 'true'
        run: |
          ./build/AidynReChronicled --version
          file build/AidynReChronicled
          otool -L build/AidynReChronicled

      - name: Packs (from our newest release)
        if: steps.have.outputs.ok == 'true'
        run: python3 -I tools/macos/fetch_packs.py "$RUNNER_TEMP/packs"

      - name: Package (.app, ROM guard, signature, .dmg)
        if: steps.have.outputs.ok == 'true'
        run: tools/macos/package_macos.sh "$VERSION" "$HOME/sdl2/lib" "$RUNNER_TEMP/packs" baserom.z64

      # Only the .dmg and its checksum leave the job: no ROM and no recompiled source. One day, then it's gone.
      - name: Keep the .dmg
        if: steps.have.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            dist/macos/*.dmg
            dist/macos/*.sha256
          retention-days: 1
          compression-level: 0

      - name: Remove the ROM
        if: always()
        run: rm -f baserom.z64

  # A draft pre-release holding the .dmg: visible only to people with write access, never published from here.
  # Publishing it (as a pre-release, so it is never "Latest" and the game's own update check ignores it) is spitzdano's call.
  draft:
    needs: macos
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version || '1.0.3-beta.0' }}
    steps:
      - name: Get the .dmg
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: dmg
      - name: Check it
        run: |
          cd dmg
          ls -l
          sha256sum -c ./*.sha256 2>/dev/null || shasum -a 256 -c ./*.sha256
      - name: Make the draft
        run: |
          tag="v$VERSION"
          # An earlier draft of the same name is replaced; a published release never is.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null | grep -q true; then
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
          elif gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag is already published: not touching it"; exit 1
          fi
          cat > notes.md <<NOTES
          **Aidyn ReChronicled for macOS ($VERSION), a beta.** Apple Silicon (M1 or later), macOS 15 or later. It has not been played on a Mac yet by its maker: please report what you find.

          1. Open the \`.dmg\` and drag **Aidyn ReChronicled** to Applications.
          2. Open it. macOS says it can't verify the app: click **Done**.
          3. System Settings > Privacy & Security, scroll down, click **Open Anyway** next to the Aidyn message, and confirm with your password.
          4. On the first start choose your own North American 1.0 Aidyn Chronicles ROM (\`.z64\`). The app contains no ROM.

          Terminal alternative: \`xattr -dr com.apple.quarantine "/Applications/Aidyn ReChronicled.app"\`

          Saves and settings live in \`~/Library/Application Support/AidynReChronicled\`. The game's Updates page opens this release page when a newer Mac build is out.
          NOTES
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --prerelease --target "$GITHUB_SHA" \
              --title "Aidyn ReChronicled $VERSION for macOS (beta)" --notes-file notes.md dmg/*.dmg dmg/*.sha256
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,url -q '"draft=\(.isDraft) prerelease=\(.isPrerelease) \(.url)"'
