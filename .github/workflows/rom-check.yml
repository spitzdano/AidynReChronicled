# Manual check that the private ROM repo can be cloned with the secrets (macOS build plan, phase 1).
# Prints the ROM's SHA-1 and compares it with rom.sha1. The ROM is never uploaded, cached or printed.
name: rom-check

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_TERMINAL_PROMPT: '0'

jobs:
  rom:
    runs-on: ubuntu-latest
    steps:
      - name: Clone the project and the ROM
        env:
          ROM_REPO: ${{ secrets.ROM_REPO }}
          ROM_REPO_TOKEN: ${{ secrets.ROM_REPO_TOKEN }}
        run: |
          if [ -z "$ROM_REPO" ] || [ -z "$ROM_REPO_TOKEN" ]; then
            echo "ROM_REPO / ROM_REPO_TOKEN not set: skipping"; exit 0
          fi
          git clone -q --depth 1 "https://github.com/$GITHUB_REPOSITORY" src
          git clone -q --depth 1 "https://x-access-token:$ROM_REPO_TOKEN@github.com/$ROM_REPO.git" rom-src
          want=$(cut -d' ' -f1 src/rom.sha1)
          have=$(sha1sum rom-src/baserom.us.z64 | cut -d' ' -f1)
          echo "wanted: $want"
          echo "found:  $have"
          [ "$want" = "$have" ] && echo "ROM OK" || { echo "ROM does not match"; exit 1; }
